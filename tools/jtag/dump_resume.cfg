# Одноразово: подключиться, прочитать и ОТПУСТИТЬ ядро (resume) перед выходом,
# чтобы прошивка продолжала работать, а openocd отключился.
source [find interface/cmsis-dap.cfg]
transport select jtag
adapter speed 500
set _CHIPNAME h3
set _DAP_TAPID 0x5ba00477
jtag newtap $_CHIPNAME dap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.dap
target create $_CHIPNAME.cpu cortex_a -dap $_CHIPNAME.dap
reset_config trst_only srst_nogate
init
halt
sleep 100
echo "--- CH0..11 (EN,DESC,CFG,CUR_SRC) ---"
echo "== ch0 =="; mdw 0x01C02100 8
echo "== ch1 =="; mdw 0x01C02140 8
echo "== ch2 =="; mdw 0x01C02180 8
echo "== ch3 =="; mdw 0x01C021C0 8
echo "== ch4 =="; mdw 0x01C02200 8
echo "== ch5 =="; mdw 0x01C02240 8
echo "== ch6 =="; mdw 0x01C02280 8
echo "== ch7 =="; mdw 0x01C022C0 8
echo "== ch8 =="; mdw 0x01C02300 8
echo "== ch9 =="; mdw 0x01C02340 8
echo "== ch10 =="; mdw 0x01C02380 8
echo "== ch11 =="; mdw 0x01C023C0 8
echo "== DMA_STA =="; mdw 0x01C02030 1
echo "--- DONE ---"
resume
shutdown