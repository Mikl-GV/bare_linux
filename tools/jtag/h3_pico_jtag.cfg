# OpenOCD: JTAGprobe (CMSIS-DAP) -> Allwinner H3 (Cortex-A7), JTAG
# Проверенный конфиг (JTAG-SETUP.md):
#   TAP 0x5ba00477, скорост 500 кГц, CPU halt работает, 6 breakpoints.
# Распиновка: PA0=TMS(GP14) PA1=TCK(GP19) PA2=TDO(GP21) PA3=TDI(GP18).

adapter driver cmsis-dap
transport select jtag
adapter speed 500

set _CHIPNAME h3
set _DAP_TAPID 0x5ba00477

jtag newtap $_CHIPNAME dap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.dap

target create $_CHIPNAME.cpu cortex_a -dap $_CHIPNAME.dap
reset_config trst_only srst_nogate

$_CHIPNAME.cpu configure -event reset-init {
    halt
}

init
scan_chain
halt